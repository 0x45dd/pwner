[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "pwner"
version = "0.3.2"
description = "Autonomous agentic network penetration-testing tool (authorized use only)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "pentest", "penetration-testing", "security", "offensive-security", "infosec",
    "nmap", "active-directory", "kerberos", "llm", "agent", "local-llm", "ollama",
    "pci-dss", "red-team", "cli",
]
# The Python versions are the ones CI actually runs (3.10 through 3.13); PyPI uses these
# for its own filtering, so listing a version here is a claim that it is tested.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "rich>=13.0",
    "textual>=0.60",
]

[project.urls]
Homepage = "https://www.pwner.si"
Documentation = "https://www.pwner.si/docs"
Source = "https://github.com/0x45dd/pwner"
Issues = "https://github.com/0x45dd/pwner/issues"
Security = "https://github.com/0x45dd/pwner/security/policy"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pwner = "pwner.cli:main"

[tool.setuptools]
packages = ["pwner", "pwner.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is offline by design: no nmap, no sockets, no API calls. Keep it that way —
# a test that needs the network belongs behind an explicit marker, not in the default run.
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Pinned explicitly so CI does not inherit whatever config sits above the repo.
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",    # line length is reported by the formatter, not worth failing CI over
    "B008",    # argparse/dataclass defaults in call position are idiomatic here
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose: the scope guard is the thing under test.
"tests/*" = ["E402"]
