[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwner"
version = "0.1.0"
description = "Autonomous agentic network penetration-testing tool (authorized use only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "rich>=13.0",
    "textual>=0.60",
]

[project.scripts]
pwner = "pwner.cli:main"

[tool.setuptools]
packages = ["pwner"]
