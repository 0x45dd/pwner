name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is offline by design — no nmap, no sockets, no API calls — so CI needs
      # none of the external binaries pwner shells out to at runtime.
      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Import check
        run: python -c "import pwner, pwner.cli, pwner.app; print(pwner.__version__)"
