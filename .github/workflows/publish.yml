name: publish

# Publishes to PyPI when a GitHub release is published. Authentication is PyPI Trusted
# Publishing (OIDC), so there is no API token in this repository's secrets and nothing to
# leak or rotate: PyPI verifies the workflow identity instead. This requires a publisher
# configured at pypi.org for owner 0x45dd, repository pwner, workflow publish.yml and
# environment pypi.
on:
  release:
    types: [published]
  # Lets a failed publish be retried without cutting a new release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag is already tested by ci.yml on main, but main can move after the tag, so the
  # artifacts are tested here as built rather than trusted on the strength of an earlier run.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      # A tag whose version does not match pyproject.toml would publish the wrong number to
      # PyPI, where it cannot be corrected or re-uploaded. Fail before that happens.
      - name: Tag matches the package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - name: Install the built wheel and run it
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/pwner --version

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token PyPI checks; this is the whole credential
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
